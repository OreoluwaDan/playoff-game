<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- This line makes the page fit phone screens properly. Never remove it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PlayOff</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="center">
    <h1>PlayOff<span class="cursor">_</span></h1>
    <p id="status">Connecting…</p>
    <p id="online"></p>

    <input id="nameInput" type="text" placeholder="Your nickname" maxlength="20" autocomplete="off" />
    <button id="helloBtn">Say hello</button>

    <p id="reply"></p>
  </main>

  <!-- This file is served automatically by Socket.IO. It gives us the io() function. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
